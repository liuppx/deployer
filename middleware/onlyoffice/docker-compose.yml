services:
  onlyoffice:
    image: onlyoffice/documentserver:${ONLYOFFICE_VERSION:-8.2}
    container_name: onlyoffice-documentserver
    restart: unless-stopped
    ports:
      - "${ONLYOFFICE_BIND_ADDRESS:-127.0.0.1}:${ONLYOFFICE_PORT:-18088}:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-change-me-to-a-long-random-secret}"
      JWT_HEADER: "${ONLYOFFICE_JWT_HEADER:-Authorization}"
      JWT_IN_BODY: "${ONLYOFFICE_JWT_IN_BODY:-true}"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-log:/var/log/onlyoffice
      - onlyoffice-cache:/var/lib/onlyoffice
      - onlyoffice-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - onlyoffice-network

networks:
  onlyoffice-network:
    name: onlyoffice-network
    driver: bridge

volumes:
  onlyoffice-data:
    name: onlyoffice-data
  onlyoffice-log:
    name: onlyoffice-log
  onlyoffice-cache:
    name: onlyoffice-cache
  onlyoffice-db:
    name: onlyoffice-db
